version: '3.9'

services:
  listener:
    build: .
    container_name: home_listener
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    devices:
      - "/dev/snd:/dev/snd"   # Audio input passthrough (Linux) — Windows uses host mic via Docker Desktop
    environment:
      - TZ=America/New_York
    stdin_open: true
    tty: true
